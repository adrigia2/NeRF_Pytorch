# Conda environment for the NeRF_Pytorch hybrid rendering pipeline.
#
#   conda env create -f environment.yml
#   conda activate tesi-nerf
#
# The native OptiX module (OptixProgrammablePasses) is NOT listed here: it is a
# local pybind11/CMake extension that has to be compiled against the CUDA Toolkit
# and the OptiX SDK, and listing it would make this file fail to resolve on any
# machine without them. Install it separately, from this environment:
#
#   pip install -e ../OptixProjectCMake
#
# It is only needed by pipeline Steps 1 and 3 (the OptiX ray tracing passes).
# Step 2 (NeRF training) needs a CUDA GPU but not the extension, and Step 4
# (PBR reconstruction) needs neither.
#
# Versions are pinned to the ones the thesis results were produced with.
name: tesi-nerf

channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip

  - pip:
      # CUDA 13.0 build of PyTorch; not on PyPI, hence the extra index.
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.9.0+cu130

      - numpy==2.1.2
      - scipy==1.15.3

      # openexr also installs the legacy `Imath` module the pipeline imports.
      - openexr==3.4.4
      - pillow==11.3.0
      - opencv-python==4.13.0.92

      - matplotlib==3.10.7
      - tqdm==4.67.1
      - tensorboard==2.18.0
